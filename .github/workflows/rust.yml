name: Rust CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, "1.81", "1.75"]

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build (stable workspace)
        if: matrix.rust == 'stable'
        run: cargo build --workspace --verbose --locked

      - name: Test (stable workspace default)
        if: matrix.rust == 'stable'
        run: cargo test --workspace --verbose --locked

      - name: Test (stable workspace all-features)
        if: matrix.rust == 'stable'
        run: cargo test --workspace --all-features --verbose --locked

      - name: Test (stable workspace doctests)
        if: matrix.rust == 'stable'
        run: cargo test --doc --workspace --locked

      - name: Check (MSRV 1.81 swarm-torch)
        if: matrix.rust == '1.81'
        run: cargo check -p swarm-torch --locked

      - name: Build (MSRV 1.75 core std)
        if: matrix.rust == '1.75'
        run: cargo build -p swarm-torch-core --lib --verbose --locked

      - name: Build (MSRV 1.75 portable crates no_std minimal & alloc)
        if: matrix.rust == '1.75'
        run: |
          cargo build -p swarm-torch-core --no-default-features --verbose --locked
          cargo build -p swarm-torch-core --no-default-features --features alloc --verbose --locked
          cargo check -p swarm-torch-models --no-default-features --locked
          cargo check -p swarm-torch-models --no-default-features --features alloc --locked
          cargo check -p swarm-torch-net --no-default-features --locked
          cargo check -p swarm-torch-net --no-default-features --features alloc --locked
          cargo check -p swarm-torch-net --no-default-features --features "lora-transport,ble-transport" --locked
          cargo check -p swarm-torch-net --no-default-features --features "alloc,lora-transport,ble-transport" --locked
          cargo check -p swarm-torch-runtime --no-default-features --locked
          cargo check -p swarm-torch-runtime --no-default-features --features alloc --locked

      - name: Format (stable only)
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Lint (stable only)
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Docs (stable only, deny warnings)
        if: matrix.rust == 'stable'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --locked

      - name: no_std & radio feature matrix gate (stable only)
        if: matrix.rust == 'stable'
        run: |
          cargo test -p swarm-torch-core --no-default-features --lib --locked
          cargo test -p swarm-torch-core --no-default-features --features alloc --lib --locked
          cargo test -p swarm-torch-net --no-default-features --features "lora-transport,ble-transport" --lib --locked
          cargo test -p swarm-torch-net --no-default-features --features "alloc,lora-transport,ble-transport" --lib --locked

      - name: Artifact pipeline example (stable only)
        if: matrix.rust == 'stable'
        run: cargo run -p swarm-torch --example artifact_pipeline --locked

      - name: Package verification (stable only)
        if: matrix.rust == 'stable'
        run: |
          cargo package --workspace --no-verify --locked
          cargo package -p swarm-torch-core --locked

  supply_chain:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install supply-chain tools
        run: |
          cargo install --locked cargo-deny --version 0.19.0
          cargo install --locked cargo-audit --version 0.22.1
          cargo install --locked cargo-vet --version 0.10.2

      - name: Enforce exemption rationale policy (PR)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          BASE_SHA="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          ADDED_EXEMPTIONS="$(git diff --unified=0 "${BASE_SHA}...HEAD" -- supply-chain/config.toml | grep -E '^\+\[\[exemptions\.' || true)"
          if [[ -n "${ADDED_EXEMPTIONS}" ]]; then
            if ! git diff --name-only "${BASE_SHA}...HEAD" | grep -Eq '^supply-chain/exemption-rationale\.md$'; then
              echo "New cargo-vet exemptions detected in supply-chain/config.toml."
              echo "You must update supply-chain/exemption-rationale.md with explicit rationale entries."
              exit 1
            fi
          fi

      - name: cargo deny (blocking)
        run: cargo deny check

      - name: cargo deny standalone adapters (blocking)
        run: |
          cargo deny --manifest-path adapters/swarm-torch-wasm/Cargo.toml --all-features --locked check
          cargo deny --manifest-path adapters/swarm-torch-mcp/Cargo.toml --all-features --locked check
          cargo deny --manifest-path adapters/swarm-torch-transport-iroh/Cargo.toml --all-features --locked check
          cargo deny --manifest-path adapters/swarm-torch-transport-zenoh/Cargo.toml --all-features --locked check
          cargo deny --manifest-path adapters/swarm-torch-backends/Cargo.toml --all-features --locked check

      - name: cargo audit (blocking)
        # Isolated DB path: cargo-deny leaves a non-git advisory layout under
        # ~/.cargo that cargo-audit (gix) refuses to clone into.
        run: cargo audit --db "${RUNNER_TEMP}/rustsec-advisory-db"

      - name: cargo vet (blocking)
        run: cargo vet

  windows_artifact_trust:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Build workspace (Windows)
        run: cargo build --workspace --verbose --locked

      - name: Artifact trust-boundary tests (Windows)
        run: cargo test -p swarm-torch artifacts::tests::validate_manifest_ --locked

      - name: Report loader trust checks (Windows)
        run: cargo test -p swarm-torch report::tests::load_report_ --locked

  embedded_targets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: thumbv6m-none-eabi,thumbv7em-none-eabihf,riscv32imc-unknown-none-elf
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Check core minimal no_std (Cortex-M0+ thumbv6m)
        run: cargo check -p swarm-torch-core --target thumbv6m-none-eabi --no-default-features --locked

      - name: Check core alloc no_std (Cortex-M0+ thumbv6m)
        run: cargo check -p swarm-torch-core --target thumbv6m-none-eabi --no-default-features --features alloc --locked

      - name: Check portable crates alloc no_std (Cortex-M4F/M7 thumbv7em)
        run: cargo check -p swarm-torch-core -p swarm-torch-models -p swarm-torch-net -p swarm-torch-runtime --target thumbv7em-none-eabihf --no-default-features --features alloc --locked

      - name: Check portable crates alloc no_std (32-bit RISC-V riscv32imc portable-atomic)
        run: cargo check -p swarm-torch-core -p swarm-torch-models -p swarm-torch-net -p swarm-torch-runtime --target riscv32imc-unknown-none-elf --no-default-features --features alloc --locked

      - name: Check Embassy runtime minimal no_std (thumbv6m)
        run: cargo check -p swarm-torch-runtime --target thumbv6m-none-eabi --no-default-features --features embassy --locked

      - name: Check Embassy runtime alloc no_std (thumbv7em)
        run: cargo check -p swarm-torch-runtime --target thumbv7em-none-eabihf --no-default-features --features "alloc,embassy" --locked

      - name: Check LoRa & BLE radio transports no_std (thumbv6m / thumbv7em / riscv32imc)
        run: |
          cargo check -p swarm-torch-net --target thumbv6m-none-eabi --no-default-features --features "lora-transport,ble-transport" --locked
          cargo check -p swarm-torch-net --target thumbv7em-none-eabihf --no-default-features --features "alloc,lora-transport,ble-transport" --locked
          cargo check -p swarm-torch-net --target riscv32imc-unknown-none-elf --no-default-features --features "alloc,lora-transport,ble-transport" --locked

  standalone_adapters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Lockfile gate (every --locked manifest has its Cargo.lock committed)
        run: bash .github/scripts/check-locked-lockfiles.sh

      # Each lane runs even if an earlier lane failed, so one broken adapter can
      # never hide the other four behind `skipped`.
      - name: Conformance (adapters/swarm-torch-wasm)
        id: wasm
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo clippy --manifest-path adapters/swarm-torch-wasm/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path adapters/swarm-torch-wasm/Cargo.toml --all-features --locked 2>&1 | tee "$RUNNER_TEMP/wasm.log"
          # Declared rust-version = "1.86" (`wasmi 2.0`).
          rustup toolchain install 1.86.0 --profile minimal --no-self-update
          cargo +1.86.0 check --manifest-path adapters/swarm-torch-wasm/Cargo.toml --all-targets --all-features --locked

      - name: Conformance (adapters/swarm-torch-mcp)
        id: mcp
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo clippy --manifest-path adapters/swarm-torch-mcp/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path adapters/swarm-torch-mcp/Cargo.toml --all-features --locked 2>&1 | tee "$RUNNER_TEMP/mcp.log"
          # Declared rust-version = "1.88" (`rmcp 3.11`, Wave 15 decision A3).
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 check --manifest-path adapters/swarm-torch-mcp/Cargo.toml --all-targets --all-features --locked

      - name: Conformance (adapters/swarm-torch-transport-iroh)
        id: iroh
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo clippy --manifest-path adapters/swarm-torch-transport-iroh/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path adapters/swarm-torch-transport-iroh/Cargo.toml --all-features --locked 2>&1 | tee "$RUNNER_TEMP/iroh.log"
          # Declared rust-version = "1.91" (`iroh 1.4`).
          rustup toolchain install 1.91.0 --profile minimal --no-self-update
          cargo +1.91.0 check --manifest-path adapters/swarm-torch-transport-iroh/Cargo.toml --all-targets --all-features --locked

      - name: Conformance (adapters/swarm-torch-transport-zenoh)
        id: zenoh
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo clippy --manifest-path adapters/swarm-torch-transport-zenoh/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path adapters/swarm-torch-transport-zenoh/Cargo.toml --all-features --locked 2>&1 | tee "$RUNNER_TEMP/zenoh.log"
          # Declared rust-version = "1.88" (keeps `time` patched for RUSTSEC-2026-0009).
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          cargo +1.88.0 check --manifest-path adapters/swarm-torch-transport-zenoh/Cargo.toml --all-targets --all-features --locked

      - name: Conformance (adapters/swarm-torch-backends default + all-features)
        id: backends
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo clippy --manifest-path adapters/swarm-torch-backends/Cargo.toml --all-targets --locked -- -D warnings
          cargo test --manifest-path adapters/swarm-torch-backends/Cargo.toml --locked 2>&1 | tee "$RUNNER_TEMP/backends.log"
          cargo clippy --manifest-path adapters/swarm-torch-backends/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo test --manifest-path adapters/swarm-torch-backends/Cargo.toml --all-features --locked 2>&1 | tee -a "$RUNNER_TEMP/backends.log"
          # Declared rust-version = "1.92" (`burn 0.21`, Wave 15 decision A5).
          rustup toolchain install 1.92.0 --profile minimal --no-self-update
          cargo +1.92.0 check --manifest-path adapters/swarm-torch-backends/Cargo.toml --all-targets --all-features --locked

      - name: Require all five adapter lanes executed
        if: ${{ always() }}
        shell: bash
        env:
          LANES: >-
            wasm=${{ steps.wasm.outcome }}
            mcp=${{ steps.mcp.outcome }}
            iroh=${{ steps.iroh.outcome }}
            zenoh=${{ steps.zenoh.outcome }}
            backends=${{ steps.backends.outcome }}
        run: |
          fail=0
          echo "| lane | outcome | tests passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| :--- | :--- | ---: |" >> "$GITHUB_STEP_SUMMARY"
          for entry in $LANES; do
            lane="${entry%%=*}"; outcome="${entry#*=}"
            passed=$(grep -ohE 'test result: ok\. [0-9]+ passed' "$RUNNER_TEMP/$lane.log" 2>/dev/null | awk '{s += $4} END {print s + 0}')
            echo "| $lane | ${outcome:-missing} | $passed |" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$outcome" != "success" ]]; then
              echo "::error::adapter lane '$lane' did not succeed (outcome: ${outcome:-missing})"; fail=1
            elif [[ "$passed" -eq 0 ]]; then
              echo "::error::adapter lane '$lane' succeeded but executed 0 tests"; fail=1
            else
              echo "ok   $lane: $passed tests passed"
            fi
          done
          exit "$fail"
