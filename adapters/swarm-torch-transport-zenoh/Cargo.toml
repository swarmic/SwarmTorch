[package]
name = "swarm-torch-transport-zenoh"
version = "0.1.0"
edition = "2021"
# Founder decision (2026-11-18, supersedes A5): 1.88 keeps `time` on a release patched for
# RUSTSEC-2026-0009 (>= 0.3.47, all of which need Rust 1.88).
rust-version = "1.88"
license = "MPL-2.0"
publish = false
description = "Isolated Zenoh pub/sub topic contract carrier adapter for SwarmTorch"

[workspace]

[dependencies]
swarm-torch-core = { path = "../../swarm-torch-core" }
swarm-torch-net = { path = "../../swarm-torch-net" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
zenoh = { version = "1.10.2", default-features = false, features = ["transport_tcp"] }
