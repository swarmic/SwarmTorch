# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# cargo-deny 0.19 expects scope selection for unmaintained and unsound checks.
# Use full graph coverage for unmaintained and workspace scope for unsound.
unmaintained = "all"
unsound = "workspace"
# RUSTSEC-2025-0141 (bincode 2.0.0-rc.3 via burn-core) retired in Wave 9 (W9-05 / P2-11).
ignore = [
    { id = "RUSTSEC-2026-0386", reason = "Affects only tokio::io::unix::AsyncFd safe constructors, which SwarmTorch never calls (0 references across workspace/adapters); tokio 1.49.0 remains pinned in root Cargo.lock for cargo-vet and Rust 1.81 MSRV continuity until the next audited tokio bump." },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils 0.1.0 is archived upstream and pulled only transitively via optional embassy-time -> futures-util (no direct workspace dependency)." },
]

[licenses]
# Allow-list policy: only SPDX IDs listed below are accepted.
# Strong copyleft licenses (GPL/AGPL/LGPL) are implicitly denied by omission.
allow = [
    "MPL-2.0",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# Deny specific crates if needed:
# deny = [
#     { name = "some-crate", reason = "security concern" }
# ]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
