[package]
name = "swarm-torch-net"
description = "Network transport abstractions for SwarmTorch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["networking", "transport", "embedded", "iot"]
categories = ["network-programming", "embedded", "asynchronous"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "swarm_torch_net"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "swarm-torch-core/std"]
alloc = ["swarm-torch-core/alloc"]

# Transport implementations (narrow Tokio sub-features only when transport is enabled)
tcp-transport = ["std", "dep:tokio", "tokio/net", "tokio/io-util", "tokio/time", "tokio/sync"]
udp-transport = ["std", "dep:tokio", "tokio/net", "tokio/time", "tokio/sync"]
# Placeholder Cargo feature flags reserved for future hardware radio drivers (no backend implemented yet).
ble-transport = []
lora-transport = []
wifi-transport = []

[dependencies]
swarm-torch-core = { workspace = true }
serde = { workspace = true, features = ["derive"] }
postcard = { workspace = true }

# Async runtime (optional, only activated by tcp-transport / udp-transport)
tokio = { workspace = true, optional = true }

# For embedded transports
embassy-time = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
