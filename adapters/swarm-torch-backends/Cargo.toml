[package]
name = "swarm-torch-backends"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
publish = false
description = "Isolated external DL framework adapter bridges (Burn / Candle) for SwarmTorch"

[features]
default = []
burn = []
candle = []
real-burn = ["dep:burn"]
real-candle = ["dep:candle-core", "dep:candle-nn"]

[workspace]

[dependencies]
burn = { version = "0.21.0", optional = true, default-features = false, features = ["std", "ndarray", "autodiff"] }
candle-core = { version = "0.10.2", optional = true }
candle-nn = { version = "0.10.2", optional = true }
swarm-torch-core = { path = "../../swarm-torch-core" }
swarm-torch-models = { path = "../../swarm-torch-models" }
