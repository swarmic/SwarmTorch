[package]
name = "swarm-torch-models"
description = "Reference models, analytical losses, and optimizers for SwarmTorch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["machine-learning", "models", "federated-learning", "no_std"]
categories = ["science", "algorithms", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "swarm_torch_models"
path = "src/lib.rs"

[features]
default = ["std"]
std = ["alloc", "swarm-torch-core/std"]
alloc = ["swarm-torch-core/alloc"]

[dependencies]
swarm-torch-core = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
