[package]
name = "swarm-torch-transport-iroh"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MPL-2.0"
publish = false
description = "Isolated QUIC/Iroh 1-RTT stream carrier adapter for SwarmTorch"

[workspace]

[dependencies]
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
swarm-torch-core = { path = "../../swarm-torch-core" }
swarm-torch-net = { path = "../../swarm-torch-net" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-util", "time", "net", "sync"] }
