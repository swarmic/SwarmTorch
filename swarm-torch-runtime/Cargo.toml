[package]
name = "swarm-torch-runtime"
description = "Async runtime abstractions for SwarmTorch (Tokio/Embassy)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
keywords = ["async", "runtime", "embedded", "tokio", "embassy"]
categories = ["asynchronous", "embedded", "no-std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "swarm_torch_runtime"
path = "src/lib.rs"

[features]
default = ["tokio"]
tokio = ["dep:tokio", "std", "tokio/rt", "tokio/rt-multi-thread", "tokio/time", "tokio/sync", "tokio/macros"]
embassy = ["dep:embassy-executor", "dep:embassy-time"]
embassy-std-test = ["embassy", "std", "embassy-executor/arch-std", "embassy-executor/executor-thread", "embassy-time/generic-queue-8"]
std = ["alloc", "embassy-time?/std"]
alloc = []

# Async runtime (Embassy/Tokio optional deps)
[dependencies]
# Tokio runtime (for std builds)
tokio = { workspace = true, optional = true }

# Embassy runtime (for embedded builds)
embassy-executor = { workspace = true, optional = true }
embassy-time = { workspace = true, optional = true }

# Race-free 64-bit atomics on 32-bit targets lacking native 64-bit hardware CAS/atomics (`Decision A6`).
# Uses both `fallback` (32-bit CAS lock sharding, e.g. thumbv7em) and `critical-section` (e.g. thumbv6m / riscv32i).
[target.'cfg(not(target_has_atomic = "64"))'.dependencies]
portable-atomic = { version = "1.15", default-features = false, features = ["fallback", "critical-section"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }
